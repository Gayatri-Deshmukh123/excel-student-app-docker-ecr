
<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 40px;
        }

        h1 {
            color: #1e293b;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px #ddd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #2563eb;
            color: white;
        }

        tr:nth-child(even) {
            background: #f1f5f9;
        }
    </style>
</head>

<body>

    <h1>Student Management System</h1>

    <div class="card">
        <h2>Total Students: {{ total_students }}</h2>
    </div>

    <table>
        <thead>
            <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
            </tr>
        </thead>

        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student["Student ID"] }}</td>
                <td>{{ student["Name"] }}</td>
                <td>{{ student["Email"] }}</td>
                <td>{{ student["Course"] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
